# Prometheus scrapes the services DIRECTLY on the internal network (the public gateway
# deliberately hides /metrics). Targets use the compose / Kubernetes service names.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: services
    metrics_path: /metrics
    static_configs:
      - targets: ["auth-service:8000"]
        labels: { service: auth-service }
      - targets: ["employee-service:8000"]
        labels: { service: employee-service }
      - targets: ["leave-service:8000"]
        labels: { service: leave-service }
      - targets: ["payroll-service:8000"]
        labels: { service: payroll-service }

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
