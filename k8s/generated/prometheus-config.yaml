# GENERATED by scripts/sync_k8s_configs.py from the files named below. DO NOT EDIT BY HAND.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    app.kubernetes.io/part-of: cloud-payroll
data:
  # from monitoring/prometheus/prometheus-k8s.yml
  prometheus.yml: |
    # Prometheus config for Kubernetes (the docker-compose one is prometheus.yml).
    # Each service runs several replicas, and a Service name would reach a random pod, so pods are
    # discovered one by one (needs the Role in k8s/monitoring.yaml). Pods opt in with the annotations
    # prometheus.io/scrape: "true" and prometheus.io/port. The alert rules are the same file as in compose.
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/alerts.yml

    scrape_configs:
      - job_name: services              # keeps the alert rules and dashboard identical to compose
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [cloud-payroll]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_phase]
            action: keep
            regex: Running
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: service
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
  # from monitoring/prometheus/alerts.yml
  alerts.yml: |
    # Alert rules. Unit-tested with:  promtool test rules monitoring/prometheus/alerts_test.yml
    # They show up at http://localhost:9090/alerts and on the Grafana dashboard.
    # (No Alertmanager is wired up, so nothing is emailed; see docs for the next step.)
    groups:
      - name: cloud-payroll
        rules:
          - alert: ServiceDown
            expr: up{job="services"} == 0
            for: 1m
            labels: { severity: critical }
            annotations:
              summary: "{{ $labels.service }} is down"
              description: "Prometheus could not scrape {{ $labels.service }} for over a minute."

          # In Kubernetes a service with NO pods has no scrape targets at all, so `up == 0` cannot fire.
          # This rule compares against the list of services that must exist.
          - alert: ServiceMissing
            expr: |
              (
                label_replace(vector(1), "service", "auth-service", "", "")
                or label_replace(vector(1), "service", "employee-service", "", "")
                or label_replace(vector(1), "service", "leave-service", "", "")
                or label_replace(vector(1), "service", "payroll-service", "", "")
              ) unless on (service) group by (service) (up{job="services"})
            for: 1m
            labels: { severity: critical }
            annotations:
              summary: "{{ $labels.service }} has no running instances"
              description: "Prometheus has no scrape target for {{ $labels.service }} at all (every pod gone?)."

          - alert: HighErrorRate
            expr: |
              sum by (service) (rate(http_requests_total{job="services",status="5xx"}[5m]))
                / sum by (service) (rate(http_requests_total{job="services"}[5m])) > 0.05
              and sum by (service) (rate(http_requests_total{job="services"}[5m])) > 0.01
            for: 5m
            labels: { severity: critical }
            annotations:
              summary: "{{ $labels.service }}: more than 5% of requests fail with 5xx"
              description: "Server errors for 5 minutes (ignored when traffic is under ~1 request a minute)."

          - alert: HighLatencyP95
            expr: |
              histogram_quantile(0.95,
                sum by (service, le) (rate(http_request_duration_highr_seconds_bucket{job="services"}[5m]))
              ) > 2
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.service }}: p95 latency above 2 seconds"
              description: "95% of requests have been slower than 2s for 10 minutes."

          - alert: DownstreamCallsFailing
            expr: sum by (service, target) (rate(downstream_calls_total{outcome="error"}[5m])) > 0
            for: 2m
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.service }} cannot reach {{ $labels.target }}"
              description: "Calls from {{ $labels.service }} to {{ $labels.target }} have been failing for 2 minutes."

          - alert: LoginFailureSpike
            expr: sum(rate(auth_logins_total{result="failure"}[5m])) > 0.5
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: "Many failed logins"
              description: "More than 30 failed logins a minute for 5 minutes: possible password guessing."

          - alert: LoginRateLimited
            expr: sum(increase(auth_logins_total{result="rate_limited"}[5m])) > 10
            for: 1m
            labels: { severity: warning }
            annotations:
              summary: "Login attempts are being rate limited"
              description: "Clients keep hitting the login rate limit: possible brute force."

          - alert: BankDetailsRevealSpike
            expr: sum(increase(employee_bank_reveals_total[1h])) > 100
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: "Unusually many bank account reveals"
              description: "More than 100 full account numbers revealed in an hour (one bank file reveals one per employee). Check the audit log."
