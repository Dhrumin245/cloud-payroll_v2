# CI/CD for the whole system.
#
#   every push / pull request:  lint + tests (SQLite and PostgreSQL) per service,
#                               static checks (Kubernetes manifests, monitoring, compose, Dockerfiles, workflows),
#                               end-to-end test on a throw-away Kubernetes cluster (kind)
#   push to main or a v* tag:   additionally publish the 4 images to GitHub Container Registry
#                               and attach ready-to-apply Kubernetes manifests as a build artifact
#
# No secrets to configure: publishing uses the built-in GITHUB_TOKEN.
name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  PROMETHEUS_IMAGE: prom/prometheus:v2.55.1

jobs:
  # ---------------------------------------------------------------------------------------------
  services:
    name: "${{ matrix.service }}: lint and tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, employee-service, leave-service, payroll-service]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # CI-only values, not secrets
      JWT_SECRET: ci-only-secret-key-that-is-at-least-32-characters
      BANK_ENCRYPTION_KEY: jdF7OGtle2oH62ohP9Ulw2Th-5ZTQ7zhL79AODHbw7s=
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests on SQLite (with coverage gate)
        run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=90
      - name: Tests on PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
        run: pytest -q
      - name: Migrations on PostgreSQL (upgrade, drift check, downgrade, 3 concurrent starts)
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: ../../scripts/check_migrations_pg.sh

  # ---------------------------------------------------------------------------------------------
  static:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install Python tools
        run: pip install pyyaml pytest ruff
      - name: Install Kubernetes tools (pinned, checksum-verified)
        run: |
          scripts/install_k8s_tools.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Lint the helper scripts
        run: ruff check scripts --select E,F --line-length 130
      - name: Generated ConfigMaps are up to date
        run: python scripts/sync_k8s_configs.py --check
      - name: Dashboard is valid JSON
        run: python -c "import json; json.load(open('monitoring/grafana/dashboards/cloud-payroll.json'))"

      - name: Render the Kubernetes manifests
        run: kustomize build k8s > rendered.yaml
      - name: Validate against the Kubernetes 1.30 schemas
        run: |
          kubeconform -strict -summary -kubernetes-version 1.30.0 rendered.yaml
          kubeconform -strict -summary -kubernetes-version 1.30.0 k8s/optional/hpa.yaml
      - name: Check the wiring (selectors, secrets, ports, env order, DB names)
        run: python scripts/check_k8s.py rendered.yaml
      - name: Best-practice lint (kube-linter)
        run: kube-linter lint rendered.yaml
      - name: The wiring checker itself catches 25 deliberate breakages
        run: pytest -q scripts/test_check_k8s.py

      - name: Prometheus config and alert rules (official promtool of the deployed version)
        run: |
          run_promtool() { docker run --rm -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" --entrypoint promtool "$PROMETHEUS_IMAGE" "$@"; }
          run_promtool check config /etc/prometheus/prometheus.yml
          run_promtool check config /etc/prometheus/prometheus-k8s.yml
          run_promtool test rules /etc/prometheus/alerts_test.yml

      - name: docker-compose files are valid
        run: |
          python scripts/init_env.py
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
      - name: Dockerfiles (hadolint)
        run: |
          for d in services/*-service; do
            echo "hadolint $d"
            docker run --rm -i hadolint/hadolint:v2.12.0 < "$d/Dockerfile"
          done
      - name: GitHub workflows (actionlint)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.4 -color

  # ---------------------------------------------------------------------------------------------
  e2e:
    name: End-to-end on Kubernetes (kind)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build the 4 service images
        run: |
          pids=()
          for svc in auth-service employee-service leave-service payroll-service; do
            docker build -t "cloud-payroll/$svc:local" "services/$svc" > "/tmp/build-$svc.log" 2>&1 &
            pids+=("$!")
          done
          failed=0
          for pid in "${pids[@]}"; do wait "$pid" || failed=1; done
          if [ "$failed" -ne 0 ]; then tail -n 40 /tmp/build-*.log; exit 1; fi
          docker images "cloud-payroll/*"

      - name: Create a kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: cloud-payroll
          config: .github/kind-config.yaml
          node_image: kindest/node:v1.30.4
          wait: 120s

      - name: Load the images into the cluster
        run: |
          for svc in auth-service employee-service leave-service payroll-service; do
            kind load docker-image "cloud-payroll/$svc:local" --name cloud-payroll
          done

      - name: Install the ingress controller
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.3/deploy/static/provider/kind/deploy.yaml
          kubectl wait --namespace ingress-nginx --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller --timeout=180s

      - name: Deploy the system
        run: |
          python scripts/init_env.py
          python scripts/k8s_deploy.py

      - name: Open the gateway and Prometheus
        run: |
          nohup kubectl -n ingress-nginx port-forward svc/ingress-nginx-controller 8080:80 > /tmp/pf-ingress.log 2>&1 &
          nohup kubectl -n cloud-payroll port-forward svc/prometheus 9090:9090 > /tmp/pf-prom.log 2>&1 &
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/auth/me || true)
            [ "$code" = "401" ] && break
            sleep 2
          done
          test "$code" = "401" || { echo "gateway did not come up (last status: $code)"; exit 1; }

      - name: Seed demo data
        run: python scripts/seed_demo.py
      - name: Smoke test (business flow + monitoring, 2 replicas per service = 8 targets)
        run: python scripts/smoke_test.py --prometheus http://localhost:9090 --min-targets 8

      - name: Self-healing - kill one pod of every service, then test again
        run: |
          for svc in auth-service employee-service leave-service payroll-service; do
            # exactly ONE pod per service: the second replica keeps serving while it is replaced
            pod=$(kubectl -n cloud-payroll get pod -l "app=$svc" -o jsonpath='{.items[0].metadata.name}')
            kubectl -n cloud-payroll delete pod "$pod" --wait=false --grace-period=1
          done
          for svc in auth-service employee-service leave-service payroll-service; do
            kubectl -n cloud-payroll rollout status "deployment/$svc" --timeout=180s
          done
          python scripts/smoke_test.py

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n cloud-payroll get all,pvc,ingress,job -o wide || true
          kubectl -n cloud-payroll describe pods || true
          kubectl -n cloud-payroll logs --all-containers --prefix --tail=100 -l app.kubernetes.io/part-of=cloud-payroll || true
          kubectl -n ingress-nginx logs -l app.kubernetes.io/component=controller --tail=50 || true

  # ---------------------------------------------------------------------------------------------
  publish:
    name: "Publish ${{ matrix.service }} image"
    needs: [services, static, e2e]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, employee-service, leave-service, payroll-service]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Image name (registry paths must be lower case)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96 # v5.6.1
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build and push
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
          sbom: true
          provenance: true
      - name: Vulnerability scan (report only; set exit-code to 1 to make it block)
        continue-on-error: true
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.IMAGE }}:sha-${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      - name: Summary
        run: |
          {
            echo "### ${{ matrix.service }}"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------------------------
  manifests:
    name: Deployable manifests
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install kustomize (pinned, checksum-verified)
        run: |
          scripts/install_k8s_tools.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Point the manifests at the images that were just published
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          tag="sha-${GITHUB_SHA::7}"
          cd k8s
          for svc in auth-service employee-service leave-service payroll-service; do
            kustomize edit set image "cloud-payroll/$svc=ghcr.io/$repo/$svc:$tag"
          done
          kustomize build . > "../cloud-payroll-$tag.yaml"
          grep -c "image: ghcr.io/$repo/" "../cloud-payroll-$tag.yaml" | sed 's/^/image references rewritten: /'
          echo "MANIFEST=cloud-payroll-$tag.yaml" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: kubernetes-manifests
          path: ${{ env.MANIFEST }}
          if-no-files-found: error
