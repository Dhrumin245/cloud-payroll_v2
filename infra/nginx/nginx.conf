# API gateway: one public entry point, routes by path to the four services.
# Only /auth, /users, /employees, /leaves, /leave-types, /payroll, /payslips, /attendance,
# /variable-pay and /settings are reachable. /metrics, /ready, /docs and /openapi.json of the
# services are NOT exposed here (Prometheus scrapes the services directly on the internal network).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  server_tokens off;
  client_max_body_size 1m;

  # One JSON object per line, same style as the services' logs.
  log_format json escape=json
    '{"ts":"$time_iso8601","service":"gateway","request_id":"$request_id",'
    '"remote_addr":"$remote_addr","method":"$request_method","path":"$uri",'
    '"status":$status,"duration_ms":"$request_time","upstream":"$upstream_addr",'
    '"bytes":$body_bytes_sent}';
  access_log /dev/stdout json;

  upstream auth_service     { server auth-service:8000;     keepalive 16; }
  upstream employee_service { server employee-service:8000; keepalive 16; }
  upstream leave_service    { server leave-service:8000;    keepalive 16; }
  upstream payroll_service  { server payroll-service:8000;  keepalive 16; }

  server {
    listen 80;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # OVERWRITE (never append to) X-Forwarded-For: auth-service rate-limits on the first entry,
    # so a client-supplied header must not be able to pick its own "IP".
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 3s;
    proxy_read_timeout 60s;  # payroll runs call two other services

    # Gateway's own liveness check.
    location = /health {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location ~ ^/(auth|users)(/|$)                                           { proxy_pass http://auth_service; }
    location ~ ^/employees(/|$)                                              { proxy_pass http://employee_service; }
    location ~ ^/(leaves|leave-types)(/|$)                                   { proxy_pass http://leave_service; }
    location ~ ^/(payroll|payslips|attendance|variable-pay|settings)(/|$)    { proxy_pass http://payroll_service; }

    # Anything else (including /metrics, /ready, /docs) is not public.
    location / {
      default_type application/json;
      return 404 '{"detail":"Not Found"}';
    }

    # nginx's own 502/503/504 (a service is down or too slow) as JSON. A 503 that a SERVICE
    # sends (e.g. "employee-service is unavailable") passes through untouched.
    error_page 502 503 504 = @unavailable;
    location @unavailable {
      default_type application/json;
      return 503 '{"detail":"Service temporarily unavailable"}';
    }
  }
}
