# Optional: scale each service between 2 and 4 replicas on CPU (80% of the 50m request).
# Needs metrics-server:  minikube addons enable metrics-server
# Apply with:  kubectl apply -n cloud-payroll -f k8s/optional/hpa.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: auth-service
  labels:
    app.kubernetes.io/part-of: cloud-payroll
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: auth-service
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
---
